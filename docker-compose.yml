services:
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8080:8000"
    volumes:
      - ./data/chroma_db:/chroma/chroma

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - chromadb
    volumes:
      - ./app:/app/app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    env_file: .env
    depends_on:
      - backend

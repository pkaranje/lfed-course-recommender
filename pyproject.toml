[project]
name = "lfed-course-recommender"
version = "0.1.0"
description = "AI-powered course recommender for the Linux Foundation Education catalog"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Pratik Karanje", email = "pratikkaranje03@gmail.com" }]
keywords = ["rag", "llm", "linux-foundation", "course-recommender", "generative-ai"]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "slowapi>=0.1.9",

    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # LLM provider SDKs — official only, no third-party wrappers
    "ollama>=0.3.0",
    "openai>=1.40.0",
    "google-generativeai>=0.8.0",
    "anthropic>=0.34.0",

    # Vector store
    "chromadb>=0.5.0",

    # Scraper
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "tenacity>=8.5.0",

    # Logging
    "structlog>=24.4.0",

    # Frontend
    "streamlit>=1.37.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.urls]
Homepage = "https://github.com/pkaranje/lfed-course-recommender"
Repository = "https://github.com/pkaranje/lfed-course-recommender"
Issues = "https://github.com/pkaranje/lfed-course-recommender/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70

[tool.hatch.build.targets.wheel]
packages = ["app"]
